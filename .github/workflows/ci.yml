name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10"}   # oldest Python the installer accepts
          - {os: windows-latest, python: "3.13"}   # newest
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}     # Apple Silicon runner: the MacSparky target
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4   # checks the page's script
        with:
          node-version: 20
      - name: Install
        run: python -m pip install -r requirements.txt numpy pytest ruff
      - name: Lint
        run: python -m ruff check app tests
      - name: Tests
        run: python -m pytest

  powershell:
    name: Installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1 (what "irm | iex" runs on)
        shell: powershell
        run: |
          foreach ($f in 'install.ps1', 'start.ps1', 'stop.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$f : $_" }; exit 1 }
            Write-Host "$f OK"
          }

  shell:
    name: macOS shell scripts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with the bash 3.2 of macOS (what "curl | bash" runs on)
        run: for f in install.sh start.sh stop.sh Sparky.command; do /bin/bash -n "$f" && echo "$f OK"; done
      - name: ShellCheck
        run: brew install shellcheck && shellcheck -S warning install.sh start.sh stop.sh Sparky.command
